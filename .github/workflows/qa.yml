name: Site QA

on:
  push:
    branches: [claude/dutch-belgian-market-research-cmxwyh, main]
    paths: ['site/**', 'tools/**', '.github/workflows/qa.yml']
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run site checks
        run: python3 tools/site_check.py
